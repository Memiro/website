# Base contour: the web and db services without ports and env files —
# a contour is chosen by an overlay (docker-compose.local.yaml /
# docker-compose.test.yaml).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # inside the contour the database goes by its service name, while .env*
    # keeps the address for whoever comes from the host — so host and port
    # are set here
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ping')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  db:
    image: postgres:18-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
