[default.extend-words]
ba = "ba"
# Django's own name for the asynchronous ``count()`` of a queryset.
acount = "acount"
# Шестнадцатеричный цвет заливки итога в книге расчёта, а не слово.
EDE = "EDE"

# Транслитерированные слаги старого WordPress — данные, а не текст: править их
# значило бы сломать редиректы, которые ими и адресуются.
[files]
extend-exclude = ["frontend/app/lib/legacy-redirects.ts"]
