# Production override on top of docker-compose.yml:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d --build --wait
# The edge takes 80 and 443 on the host and expects the certificate certbot
# keeps on the host under /etc/letsencrypt (GETTING_STARTED.md, «Прод»).
services:
  db:
    restart: unless-stopped

  # The application reads the production config — real signing key, real
  # hosts, real database password — which lives outside git next to the
  # tracked ones (.config/config.prod.example.toml is the template).
  migrations:
    environment:
      APP_CONFIG_PATH: /app/.config/config.prod.toml
  api:
    restart: unless-stopped
    environment:
      APP_CONFIG_PATH: /app/.config/config.prod.toml
  admin:
    restart: unless-stopped
    environment:
      APP_CONFIG_PATH: /app/.config/config.prod.toml

  frontend:
    restart: unless-stopped
    build:
      # The public origin is baked into the SSR bundle (import.meta.env.PUBLIC_*).
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://memiro.ru}

  nginx:
    restart: unless-stopped
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ../.config/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - adminstatic:/usr/share/nginx/admin-static:ro
      - productmedia:/usr/share/nginx/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
