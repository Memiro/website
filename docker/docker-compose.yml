name: memiro

# Shared shape of the Python services; only command/depends_on/healthcheck differ.
x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment:
    APP_CONFIG_PATH: /app/.config/config.docker.toml
  volumes:
    - ../.config:/app/.config:ro

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: memiro
      POSTGRES_PASSWORD: memiro
      POSTGRES_DB: memiro
    ports:
      # Loopback only — for host-side tools (`just migrate`, `just run`).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP: the image's init-time temporary server listens only on
      # the unix socket and must not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U memiro -d memiro"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: `migrations apply` runs alembic and then Django's own migrate,
  # in that order; the owner's single account follows from the environment.
  migrations:
    <<: *app
    command: ["sh", "-c", "memiro migrations apply && memiro django ensure_superuser"]
    environment:
      APP_CONFIG_PATH: /app/.config/config.docker.toml
      # No defaults on purpose: a contour without credentials must fail
      # loudly in `ensure_superuser`, not quietly grow a guessable account.
      MEMIRO_ADMIN_USERNAME: ${MEMIRO_ADMIN_USERNAME:?set it in .env, see .env.example}
      MEMIRO_ADMIN_PASSWORD: ${MEMIRO_ADMIN_PASSWORD:?set it in .env, see .env.example}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["memiro", "run", "api"]
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/alive')"]
      interval: 2s
      timeout: 3s
      retries: 15

  admin:
    <<: *app
    # Same image as the api, another command: WSGI behind gunicorn. The
    # startup collectstatic refills the volume nginx serves after a rebuild.
    command:
      ["sh", "-c", "memiro django collectstatic --no-input && gunicorn --bind 0.0.0.0:8000 memiro.bootstrap.django_admin.wsgi:application"]
    volumes:
      - ../.config:/app/.config:ro
      - adminstatic:/app/staticfiles
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/')"]
      interval: 2s
      timeout: 3s
      retries: 15

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:4321').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  nginx:
    image: nginx:1.29-alpine
    ports:
      # 8080: port 80 is often taken on developer machines.
      - "127.0.0.1:${MEMIRO_HTTP_PORT:-8080}:80"
    volumes:
      - ../.config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - adminstatic:/usr/share/nginx/admin-static:ro
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  adminstatic:
