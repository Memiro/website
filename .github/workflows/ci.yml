name: ci

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  # The same steps as `just lint` + `just static`, without mutations.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra ci
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run typos
      - run: uv run basedpyright
      - run: uv run bandit -c pyproject.toml -r src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra ci
      # Integration tests bring their own Postgres via testcontainers (one per
      # xdist worker); the compose db of `just test` is a host-side convenience.
      - run: uv run pytest -n auto tests/unit tests/integration
