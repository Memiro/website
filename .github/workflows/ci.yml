name: ci

on:
  pull_request:
  push:
    branches: [dev]
    tags: ["v*"]

jobs:
  # The same steps as `just lint` + `just static`, without mutations.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra ci
      - run: uv run ruff format --check
      - run: uv run ruff check
      # The django-stubs plugin imports the admin's settings module, so the
      # type checker needs the config path every other process reads.
      - run: uv run mypy
        env:
          APP_CONFIG_PATH: .config/config.toml
      - run: uv run lint-imports
      - run: uv run typos
      - run: uv run basedpyright
      - run: uv run bandit -c pyproject.toml -r src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - run: uv sync --frozen --extra ci
      - run: just test-ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The image is built on release tags only, and only when the tag really sits
  # on main: a tag on a side branch would otherwise ship unreleased code.
  # Publishing it to a registry arrives with the production contour (ticket 23).
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The whole history, so origin/main is here for the ancestor check.
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - name: The tag must sit on the main branch
        env:
          TAG: ${{ github.ref_name }}
        run: git merge-base --is-ancestor "$TAG" origin/main
      - name: Build the image
        env:
          TAG: ${{ github.ref_name }}
        run: just image "$TAG"
