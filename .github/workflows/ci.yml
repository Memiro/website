name: ci

on:
  pull_request:
  push:
    branches: [dev]
    tags: ["v*"]

jobs:
  # The same steps as `just lint` + `just static`, without mutations.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra ci
      - run: uv run ruff format --check
      - run: uv run ruff check
      # The django-stubs plugin imports the admin's settings module, so the
      # type checker needs the config path every other process reads.
      - run: uv run mypy
        env:
          APP_CONFIG_PATH: .config/config.toml
      - run: uv run lint-imports
      - run: uv run typos
      - run: uv run basedpyright
      - run: uv run bandit -c pyproject.toml -r src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - run: uv sync --frozen --extra ci
      - run: just test-ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Both images go to GitHub Container Registry: every push to dev under the
  # tag `dev` (to check a contour before a release), every release tag under
  # its version and `latest` — and only when the tag really sits on main: a
  # tag on a side branch would otherwise ship unreleased code. The production
  # server pulls them and builds nothing (GETTING_STARTED.md, «Прод»;
  # .scratch/deploy/issues/01).
  publish:
    if: github.event_name == 'push'
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The whole history, so origin/main is here for the ancestor check.
          fetch-depth: 0
      - name: A release tag must sit on the main branch
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: git merge-base --is-ancestor "$TAG" origin/main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/memiro/website-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.backend.outputs.tags }}
          labels: ${{ steps.backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - id: frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/memiro/website-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.frontend.outputs.tags }}
          labels: ${{ steps.frontend.outputs.labels }}
          # Both are inlined into the storefront bundle (frontend/Dockerfile).
          build-args: |
            PUBLIC_SITE_URL=https://memiro.ru
            PUBLIC_METRIKA_ID=${{ vars.PUBLIC_METRIKA_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
