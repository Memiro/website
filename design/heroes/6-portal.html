<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memiro · Портал</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --night: #0f2129;
    --night-2: #16313c;
    --amber: #e8b26a;
    --cream: #f0e9db;
    --mist: #9fb0b0;
  }
  body { font-family: "Golos Text", system-ui, sans-serif; background: radial-gradient(120% 90% at 68% 42%, var(--night-2) 0%, var(--night) 62%); color: var(--cream); overflow-x: hidden; }

  .hero { position: relative; min-height: 100dvh; display: flex; flex-direction: column; }

  .nav { display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(24px, 5vw, 64px); height: 84px; position: relative; z-index: 5; }
  .wordmark { font-size: 21px; font-weight: 600; letter-spacing: 0.14em; color: var(--cream); text-decoration: none; }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .nav-right a { font-size: 14px; color: var(--mist); text-decoration: none; }
  .nav-right a:hover { color: var(--cream); }
  .nav-right .phone { color: var(--cream); font-weight: 600; }

  .stage { position: relative; flex: 1; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; padding: 0 clamp(24px, 5vw, 64px); gap: 24px; }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; padding-bottom: 24px; } }

  /* Заголовок: антиква, наезжает на арку */
  .copy { position: relative; z-index: 3; padding: 24px 0 40px; }
  .copy h1 { font-family: "Playfair Display", serif; font-weight: 500; font-size: clamp(42px, 5.6vw, 84px); line-height: 1.04; letter-spacing: 0.005em; }
  .copy h1 em { font-style: italic; color: var(--amber); padding-bottom: 4px; }
  .copy p { margin-top: 22px; font-size: 16.5px; color: var(--mist); max-width: 40ch; line-height: 1.7; }
  .cta { margin-top: 34px; display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; padding: 16px 32px; border-radius: 999px; background: var(--amber); color: #14262c; font-size: 15px; font-weight: 600; text-decoration: none; box-shadow: 0 8px 40px rgba(232, 178, 106, 0.22); transition: transform .15s; }
  .btn:hover { transform: translateY(-1px); }
  .link { font-size: 15px; color: var(--cream); text-decoration: none; border-bottom: 1px solid rgba(240, 233, 219, 0.45); padding-bottom: 3px; }
  .link:hover { border-color: var(--cream); }

  /* Арка-зеркало: страница сама выглядит как подсвеченное зеркало */
  .mirror { position: relative; z-index: 2; justify-self: center; width: min(44vw, 480px); aspect-ratio: 10 / 13; }
  @media (max-width: 900px) { .mirror { width: min(78vw, 420px); } }
  .mirror .glass {
    position: absolute; inset: 0;
    border-radius: 999px 999px 26px 26px;
    overflow: hidden;
    box-shadow:
      0 0 0 3px rgba(232, 178, 106, 0.95),
      0 0 34px 6px rgba(232, 178, 106, 0.42),
      0 0 120px 30px rgba(232, 178, 106, 0.16),
      inset 0 0 60px rgba(15, 33, 41, 0.35);
  }
  .mirror .glass img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 40%; transform: scale(1.02); }
  .mirror .caption { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); white-space: nowrap; font-size: 13px; color: var(--cream); background: rgba(15, 33, 41, 0.72); backdrop-filter: blur(8px); padding: 10px 18px; border-radius: 999px; }
  .mirror .caption b { color: var(--amber); font-weight: 600; }

  /* Категории каталога как реальные силуэты зеркал */
  .shapes { position: relative; z-index: 4; display: flex; gap: clamp(20px, 4vw, 56px); align-items: flex-end; justify-content: center; padding: 30px clamp(24px, 5vw, 64px) 40px; border-top: 1px solid rgba(240, 233, 219, 0.12); }
  .shape { display: grid; justify-items: center; gap: 12px; text-decoration: none; color: var(--mist); font-size: 13.5px; transition: color .15s; }
  .shape:hover { color: var(--cream); }
  .shape i {
    display: block; width: 46px; height: 60px;
    border: 2px solid rgba(240, 233, 219, 0.55);
    box-shadow: 0 0 18px rgba(232, 178, 106, 0.0);
    transition: box-shadow .2s, border-color .2s;
  }
  .shape:hover i { border-color: var(--amber); box-shadow: 0 0 18px rgba(232, 178, 106, 0.45); }
  .shape .round { border-radius: 50%; height: 46px; align-self: center; }
  .shape .arch { border-radius: 999px 999px 4px 4px; }
  .shape .drop { border-radius: 4px 50% 50% 50%; transform: rotate(45deg); width: 44px; height: 44px; margin: 8px 0; }
  .shape .rect { border-radius: 3px; }
  .shape .oval { border-radius: 50%; }
  @media (max-width: 640px) { .shapes { flex-wrap: wrap; gap: 22px; } }
</style>
</head>
<body>
<section class="hero">
  <header class="nav">
    <a class="wordmark" href="index.html">memiro</a>
    <div class="nav-right">
      <a href="#">Каталог</a>
      <a href="#">Доставка и установка</a>
      <a href="#">О студии</a>
      <a class="phone" href="tel:+79812304050">+7 981 230-40-50</a>
    </div>
  </header>

  <div class="stage">
    <div class="copy">
      <h1>Свет обретает<br><em>форму</em></h1>
      <p>Студия memiro делает зеркала с контурной подсветкой вручную, под ваш размер и интерьер. Санкт-Петербург, установка нашими мастерами.</p>
      <div class="cta">
        <a class="btn" href="#">Смотреть каталог</a>
        <a class="link" href="#">Рассчитать свой размер</a>
      </div>
    </div>

    <figure class="mirror">
      <div class="glass">
        <img src="https://memiro.ru/wp-content/uploads/2026/05/mir-portal-6a15d5da0e366.jpg" alt="Спальня, отражённая в арочном зеркале Mir Portal с тёплой подсветкой">
      </div>
      <figcaption class="caption"><b>Mir Portal</b> · 15 012 ₽</figcaption>
    </figure>
  </div>

  <nav class="shapes" aria-label="Формы зеркал">
    <a class="shape" href="#"><i class="round"></i>Круглые</a>
    <a class="shape" href="#"><i class="arch"></i>Арки</a>
    <a class="shape" href="#"><i class="drop"></i>Фигурные</a>
    <a class="shape" href="#"><i class="rect"></i>Прямоугольные</a>
    <a class="shape" href="#"><i class="oval"></i>Овалы</a>
  </nav>
</section>
</body>
</html>
