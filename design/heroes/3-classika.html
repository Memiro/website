<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memiro · Петербургская классика</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Golos Text", system-ui, sans-serif; color: #26282b; background: #edecea; }

  /* Editorial side-image 40/60: слева спокойная колонка, справа фото до края */
  .hero { min-height: 100dvh; display: grid; grid-template-columns: 2fr 3fr; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }

  .col { display: flex; flex-direction: column; padding: 0 clamp(24px, 5vw, 72px); }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 84px; }
  .wordmark { font-size: 21px; font-weight: 600; letter-spacing: 0.05em; text-decoration: none; color: #26282b; }
  .nav .phone { font-size: 14px; font-weight: 600; color: #26282b; text-decoration: none; }

  .copy { margin: auto 0; padding: 48px 0 96px; }
  .rule { width: 44px; border-top: 1px solid #9b9c98; margin-bottom: 28px; }
  .copy h1 { font-family: "Playfair Display", serif; font-weight: 500; font-size: clamp(34px, 3.8vw, 54px); line-height: 1.12; letter-spacing: 0; }
  .copy h1 em { font-style: italic; }
  .copy p { margin-top: 20px; font-size: 16px; color: #5b5e60; max-width: 40ch; line-height: 1.7; }
  .cta { margin-top: 36px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .link { font-size: 15px; font-weight: 600; color: #26282b; text-decoration: none; border-bottom: 1px solid #26282b; padding-bottom: 3px; }
  .link:hover { opacity: 0.7; }
  .muted { font-size: 13.5px; color: #8a8c8a; }

  .pic { position: relative; overflow: hidden; min-height: 46vh; }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; filter: saturate(0.92) contrast(1.02); }
  .pic .cap { position: absolute; left: 28px; bottom: 22px; background: rgba(237,236,234,0.92); color: #26282b; font-size: 13px; padding: 8px 16px; }
</style>
</head>
<body>
<section class="hero">
  <div class="col">
    <header class="nav">
      <a class="wordmark" href="index.html">memiro</a>
      <a class="phone" href="tel:+79812304050">+7 981 230-40-50</a>
    </header>
    <div class="copy">
      <div class="rule"></div>
      <h1>Отражение <em>вашего</em> дома</h1>
      <p>Студия зеркал в Санкт-Петербурге. Изготавливаем вручную под ваш интерьер: арки, овалы, порталы, классические рамы. Привозим и устанавливаем сами.</p>
      <div class="cta">
        <a class="link" href="#">Смотреть каталог →</a>
        <span class="muted">88 моделей · изготовление от 5 дней</span>
      </div>
    </div>
  </div>
  <div class="pic">
    <img src="https://memiro.ru/wp-content/uploads/2026/05/zerkalo-arka-grand-arc-6a15d5f39cc29.jpg" alt="Арочное зеркало Grand Arc у классической стены">
    <span class="cap">Grand Arc, арочное зеркало</span>
  </div>
</section>
</body>
</html>
