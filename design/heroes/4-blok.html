<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memiro · Цветной блок</title>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Commissioner", system-ui, sans-serif; color: #141414; background: #f4f4f1; }

  /* Color-blocked diptych: кобальт слева, светлое поле справа, фото на стыке */
  .hero { position: relative; min-height: 100dvh; display: grid; grid-template-columns: 11fr 9fr; overflow: hidden; }
  .field-l { background: #2743c7; color: #f4f4f1; display: flex; flex-direction: column; }
  .field-r { background: #f4f4f1; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .field-r { min-height: 40vh; } }

  .nav { display: flex; align-items: center; justify-content: space-between; height: 76px; padding: 0 clamp(20px, 4vw, 56px); }
  .wordmark { font-size: 22px; font-weight: 900; letter-spacing: 0.03em; text-decoration: none; color: #f4f4f1; }
  .nav .phone { font-size: 14px; font-weight: 700; color: #f4f4f1; text-decoration: none; }

  .copy { margin: auto 0; padding: 40px clamp(20px, 4vw, 56px) 96px; max-width: 620px; }
  .copy h1 { font-weight: 900; font-size: clamp(38px, 5vw, 66px); line-height: 1.0; letter-spacing: -0.02em; text-transform: uppercase; }
  .copy p { margin-top: 18px; font-size: 16.5px; font-weight: 500; color: #ccd4f2; max-width: 40ch; line-height: 1.6; }
  .cta { margin-top: 32px; display: flex; gap: 14px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; padding: 16px 30px; font-size: 15px; font-weight: 700; text-decoration: none; border-radius: 0; transition: transform .15s; }
  .btn:hover { transform: translateY(-2px); }
  .btn-white { background: #f4f4f1; color: #2743c7; }
  .btn-line { border: 2px solid #f4f4f1; color: #f4f4f1; }

  /* Фото сидит на стыке двух полей */
  .seam { position: absolute; z-index: 2; top: 50%; left: 55%; transform: translate(-50%, -50%); width: clamp(260px, 30vw, 460px); box-shadow: 0 32px 80px rgba(20, 20, 20, 0.35); }
  .seam img { width: 100%; display: block; }
  .seam .tag { position: absolute; left: 0; bottom: -44px; background: #141414; color: #f4f4f1; font-size: 13px; font-weight: 700; padding: 10px 18px; }
  @media (max-width: 860px) { .seam { display: none; } .field-r { background-image: url('https://memiro.ru/wp-content/uploads/2025/09/6899fe331968972677ff7085_Zerkalo-v-alyuminievoj-rame.webp'); background-size: cover; background-position: center; } }
</style>
</head>
<body>
<section class="hero">
  <div class="field-l">
    <header class="nav">
      <a class="wordmark" href="index.html">memiro</a>
      <a class="phone" href="tel:+79812304050">+7 981 230-40-50</a>
    </header>
    <div class="copy">
      <h1>88 зеркал.<br>Любой размер</h1>
      <p>Форма, рама и подсветка на выбор. Цена считается сразу на сайте. Доставим и повесим по Петербургу.</p>
      <div class="cta">
        <a class="btn btn-white" href="#">Смотреть каталог</a>
        <a class="btn btn-line" href="#">Рассчитать размер</a>
      </div>
    </div>
  </div>
  <div class="field-r"></div>
  <figure class="seam">
    <img src="https://memiro.ru/wp-content/uploads/2025/09/6899fe331968972677ff7085_Zerkalo-v-alyuminievoj-rame.webp" alt="Зеркало в чёрной алюминиевой раме">
    <figcaption class="tag">Kov Black · 7 998 ₽</figcaption>
  </figure>
</section>
</body>
</html>
