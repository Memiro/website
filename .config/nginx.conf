# Dev edge.
server {
    listen 80;

    # The card sends photos, and the edge is the first thing they meet:
    # nginx's own default of 1m would answer the owner with a 413 page for
    # any ordinary camera shot, instead of the refusal his form knows how to
    # say. One photo is bounded by MAX_IMAGE_BYTES (10 MB); this bounds the
    # whole save, so it is that bound times a handful of photos at once.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # collectstatic fills the volume this directory is; the admin process
    # never serves its own static.
    location /admin-static/ {
        alias /usr/share/nginx/admin-static/;
    }

    # The photo volume the admin writes to through its storage port; the
    # keys in the database are file names in this directory and nothing else.
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    location /admin/ {
        proxy_pass http://admin:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
