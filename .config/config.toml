# Local development config for host-side tools (`just run`, `just migrate`).
# The db service publishes 5432 on loopback for exactly this file.

[db]
host = "localhost"
port = 5432
user = "memiro"
password = "memiro"
database = "memiro"

[observability]
enabled = false

[email]
# Delivery is off locally until the owner supplies the manager address and an
# app password at deployment time. The Yandex sender mailbox is already known.
enabled = false
host = "smtp.yandex.ru"
port = 465
username = "memiro.ru@yandex.ru"
password = ""
from_address = "memiro.ru@yandex.ru"
manager_address = ""
timeout_seconds = 10.0

[legal]
# Редакция текста политики обработки ПДн: правится тем же коммитом, что и сам
# текст, — иначе согласие в заявке перестаёт быть доказательством (ADR-0006).
consent_version = "2026-08-31"

[admin]
# Ключ подписи сессий админки. Локальное значение — заведомо не секрет;
# в деплое файл конфигурации заполняет владелец вне git.
secret_key = "dev-only-not-a-secret"
allowed_hosts = ["localhost", "127.0.0.1"]
