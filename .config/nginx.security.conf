# Security headers of the edge, in one file: add_header is not inherited into
# a location that sets headers of its own, so every location includes this
# instead of repeating the lines (.config/nginx.conf, .config/nginx.prod.conf).
# Content-Security-Policy is deliberately absent — Astro inlines the scripts
# and styles of its islands, so the policy needs hashes or a nonce from the
# build and rides its own ticket.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
