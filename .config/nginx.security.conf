# Security headers of the edge, in one file: add_header is not inherited into
# a location that sets headers of its own, so every location includes this
# instead of repeating the lines (.config/nginx.conf, .config/nginx.prod.conf).
# Content-Security-Policy is deliberately absent — Astro inlines the scripts
# and styles of its islands, so the policy needs hashes or a nonce from the
# build and rides its own ticket.
# HSTS lives here too: every location of the production edge includes this
# file, so a location without the line would lose the header the server block
# used to hand down. A browser ignores it over plain http, so the dev edge
# including the same file costs nothing.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
