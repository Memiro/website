# In-container config for the api and migrations services (docker compose).

[db]
host = "db"
port = 5432
user = "memiro"
password = "memiro"
database = "memiro"

[observability]
enabled = false

[email]
# The deployment owner fills the manager address and app password outside git.
enabled = false
host = "smtp.yandex.ru"
port = 465
username = "memiro.ru@yandex.ru"
password = ""
from_address = "memiro.ru@yandex.ru"
manager_address = ""
timeout_seconds = 10.0

[legal]
# Редакция текста политики обработки ПДн: правится тем же коммитом, что и сам
# текст, — иначе согласие в заявке перестаёт быть доказательством (ADR-0006).
consent_version = "2026-08-31"

[admin]
# Ключ подписи сессий админки: в деплое владелец заполняет файл вне git.
secret_key = "dev-only-not-a-secret"
# Публичный вход — nginx, он и передаёт Host; список правится при деплое.
allowed_hosts = ["localhost", "127.0.0.1", "admin"]
static_root = "/app/staticfiles"
