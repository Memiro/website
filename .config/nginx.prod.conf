# Production edge: TLS from certbot on the host, http and www folded onto
# https://memiro.ru with one hop. The location blocks repeat the dev edge
# (.config/nginx.conf); what is added is transport hygiene and caching.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/plain text/xml application/xml application/json application/javascript text/javascript image/svg+xml;

# add_header is not inherited into a location that sets headers of its own,
# so the HSTS line is repeated wherever Cache-Control is set below.
server {
    listen 80;
    listen [::]:80;
    server_name memiro.ru www.memiro.ru;

    # certbot renews over http through this webroot; everything else is https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://memiro.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.memiro.ru;

    ssl_certificate /etc/letsencrypt/live/memiro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memiro.ru/privkey.pem;

    return 301 https://memiro.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name memiro.ru;

    ssl_certificate /etc/letsencrypt/live/memiro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memiro.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The card sends photos, and the edge is the first thing they meet:
    # nginx's own default of 1m would answer the owner with a 413 page for
    # any ordinary camera shot, instead of the refusal his form knows how to
    # say. One photo is bounded by MAX_IMAGE_BYTES (10 MB); this bounds the
    # whole save, so it is that bound times a handful of photos at once.
    client_max_body_size 50m;

    # Inherited by every proxied location below, none of which sets a header
    # of its own. X-Forwarded-Proto is the literal scheme and not $scheme:
    # every upstream redirect (the legacy map, the slash rule) is spelled
    # from it, and "http" would send the old addresses through a second hop.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass http://api:8000/;
    }

    # collectstatic fills the volume this directory is; the admin process
    # never serves its own static.
    location /admin-static/ {
        alias /usr/share/nginx/admin-static/;
    }

    # The photo volume the admin writes to through its storage port; the
    # keys in the database are file names in this directory and nothing else.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location /admin/ {
        proxy_pass http://admin:8000;
    }

    # Built assets carry a content hash in the name: a new build is a new
    # address, so the old one may live in caches for as long as they like.
    location /_astro/ {
        proxy_pass http://frontend:4321;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Fonts and the studio's own pictures change with a release, not a build.
    location ~ ^/(fonts|img)/ {
        proxy_pass http://frontend:4321;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # HTML keeps the frontend's own max-age=0: a page is rendered per request.
    location / {
        proxy_pass http://frontend:4321;
    }
}
