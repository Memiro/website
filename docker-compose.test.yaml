# Test contour: `just test-up` / `just test-down`.
# For whoever comes from the host the database sits on 5433 and the web
# on 8001: the local contour took 5432 and 8000.
services:
  web:
    env_file: .env.test
    ports:
      - "127.0.0.1:8001:8000"

  db:
    env_file: .env.test
    ports:
      - "127.0.0.1:5433:5432"
