# Safety net only: run `just lint` and `just static` by hand before committing.
# Hook types are chosen by `just install` (the justfile is the single source of commands).

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args: [--baseline-path, .gitleaks-baseline.json]

  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: typos
        name: typos
        entry: uv run typos
        language: system
        pass_filenames: false
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        # The django-stubs plugin imports the admin's settings module, and
        # pre-commit does not read .env the way `just` does.
        name: mypy
        entry: env APP_CONFIG_PATH=.config/config.toml uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r src
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
