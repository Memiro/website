[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memiro"]

[project]
name = "memiro"
version = "0.1.0"
description = "Сайт студии Memiro — производство интерьерных зеркал"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web: Django-монолит с SSR и типизированными JSON-эндпоинтами
    "django==6.1",
    "django-modern-rest[pydantic]==0.14.0",
    # Prod WSGI server (в dev — runserver)
    "gunicorn==26.1.0",
    # PostgreSQL в проде; в разработке SQLite и драйвер не нужен,
    # но пин держим один на все контуры
    "psycopg[binary]==3.3.4",
    # The `.env` fallback the entrypoints load for a bare local run
    "python-dotenv==1.2.3",
]

[dependency-groups]
lint = [
    "ruff==0.16.3",
    "mypy==2.3.1",
    "django-stubs[compatible-mypy]==6.1.0",
    "bandit==1.9.4",
    "codespell==2.4.3",
]
test = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "coverage[toml]==7.15.4",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "pre-commit==4.6.2",
    "detect-secrets==1.5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "memiro.settings"
xfail_strict = true
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.mypy]
mypy_path = "src"
files = ["src", "tests"]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]

strict = true
pretty = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
allow_redefinition = true
allow_untyped_calls = true
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
show_error_codes = true
show_error_context = true
show_column_numbers = true
check_untyped_defs = true
namespace_packages = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "memiro.settings"

[tool.ruff]
src = ["src"]
include = ["src/**.py", "tests/**.py", "manage.py"]
target-version = "py314"
line-length = 79
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "CPY001", "A005", "COM812"]
# Russian text in string literals (product and test data): Cyrillic that
# looks like Latin is just Russian letters, not a layout typo
allowed-confusables = [
    "а", "б", "г", "е", "з", "к", "о", "р", "с", "у", "х",
    "А", "В", "Е", "З", "К", "М", "Н", "О", "Р", "С", "Т", "У", "Х",
]

[tool.ruff.lint.per-file-ignores]
# Django settings — модульные константы, а не код: магические числа
# и «неиспользуемые» импорты здесь читает сам Django
"src/memiro/settings.py" = ["S105"]
# Миграции пишет Django, их стиль не наш
"src/memiro/**/migrations/**" = ["ALL"]
# S101: assert — язык pytest; S105/S106: пароли в тестах выдуманы;
# TC002: аннотации фикстур pytest — документация, прятать их в
# TYPE_CHECKING в тестах незачем
"tests/**" = ["S101", "S105", "S106", "TC002"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
no-lines-before = ["local-folder"]

[tool.coverage.run]
parallel = true
branch = true
source = ["src", "tests"]
omit = ["**/__init__.py", "**/migrations/**"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    'if TYPE_CHECKING:',
    "if __name__ == .__main__.:",
    '@(abc\.)?abstractmethod',
    "raise NotImplementedError",
    "pass",
    '\.\.\.',
]
omit = ['*/__init__.py']

[tool.bandit]
targets = "src"

[tool.codespell]
skip = "*.pyi,*.pyc,./site,uv.lock"
