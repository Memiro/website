{% load catalog_tags %}
<article class="product-card">
  <a class="card-link" href="{% url 'product' product.category.slug product.slug %}">
    <div class="pic">
      {% if product.is_promo %}<span class="badge">Акция</span>{% endif %}
      {% if product.photo_small %}
      <img src="{{ product.photo_small.url }}" alt="{{ product.name }}" loading="lazy">
      {% endif %}
    </div>
    <div class="meta">
      <div class="name">{{ product.name }}</div>
    </div>
  </a>
  {# Ту же карточку строит shop.js для страницы избранного (favoriteCard) —
     разметку правим в обоих местах #}
  <div class="card-actions">
    <span class="price">от {{ product.price|rub }} ₽</span>
    <div class="card-buttons">
      <button class="fav-btn" type="button" data-toggle="favorites" data-product="{{ product.pk }}"
              aria-pressed="false" data-label-off="В избранное" data-label-on="В избранном"
              title="В избранное" aria-label="В избранное">{% include "icons/heart.svg" %}</button>
      <button class="cart-btn" type="button" data-toggle="cart" data-product="{{ product.pk }}"
              aria-pressed="false" data-label-off="В корзину" data-label-on="В корзине">В корзину</button>
    </div>
  </div>
</article>
