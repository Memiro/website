{# Плитки витрины: главная и корень каталога рисуют их одинаково #}
<div class="cats-grid">
  {% for tile in tiles %}
  <a class="cat" href="{{ tile.url }}">
    {% if tile.cover %}<img src="{{ tile.cover.url }}" alt="" loading="lazy">{% endif %}
    <span class="veil"></span>
    <span class="label">{{ tile.label }}</span>
  </a>
  {% endfor %}
</div>
